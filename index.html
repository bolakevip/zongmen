<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宗门经营录 · 境界版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    color: #d4c8b8;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 20px; user-select: none;
    background: radial-gradient(ellipse at top, #1a1610 0%, #0d0b08 100%);
  }
  #app {
    width: 100%; max-width: 1400px;
    background: #1a1610;
    border: 1px solid #3a3020; border-radius: 14px; padding: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9);
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #0f0c08; border: 1px solid #2a2418; border-radius: 10px;
    padding: 12px 20px; margin-bottom: 14px;
  }
  .top-bar .sect-name {
    font-size: 20px; color: #d4a857; font-weight: bold;
    letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(212,168,87,0.5);
  }
  .top-bar .resources { display: flex; gap: 20px; font-size: 13px; flex-wrap: wrap; }
  .top-bar .resources span { color: #b8a888; }
  .top-bar .resources b {
    color: #d4a857; font-family: monospace; font-size: 14px;
    margin-left: 4px;
  }
  .main-layout { display: flex; gap: 14px; margin-bottom: 14px; }
  .map-area {
    flex: 0 0 900px; height: 600px;
    background: linear-gradient(180deg, #1a2418 0%, #0f1a10 50%, #1a1008 100%);
    border: 1px solid #3a3020; border-radius: 12px;
    position: relative; overflow: hidden;
  }
  .map-bg-mountain {
    position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
    background: linear-gradient(180deg, transparent 0%, #0a0805 100%);
    pointer-events: none;
  }
  .map-bg-stars {
    position: absolute; inset: 0;
    background-image: radial-gradient(1px 1px at 20% 15%, #fff 0%, transparent 100%),
                      radial-gradient(1px 1px at 60% 25%, #fff 0%, transparent 100%),
                      radial-gradient(1px 1px at 80% 10%, #fff 0%, transparent 100%),
                      radial-gradient(1px 1px at 35% 40%, #fff 0%, transparent 100%),
                      radial-gradient(1px 1px at 90% 35%, #fff 0%, transparent 100%);
    opacity: 0.3; pointer-events: none;
  }
  .building {
    position: absolute; text-align: center; cursor: pointer;
    transition: transform 0.2s, filter 0.2s;
    transform: translate(-50%, -50%);
    z-index: 3;
  }
  .building:hover { transform: translate(-50%, -50%) scale(1.15); filter: brightness(1.3); }
  .building .b-icon { font-size: 44px; display: block; line-height: 1; }
  .building .b-name {
    font-size: 15px; color: #d4a857; margin-top: 4px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9);
  }
  .building .b-lv {
    font-size: 11px; color: #b8a888; margin-top: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9);
  }
  .disciple-dot {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    transition: left 1.5s linear, top 1.5s linear, opacity 0.5s;
    transform: translate(-50%, -50%); z-index: 2;
    box-shadow: 0 0 8px currentColor;
  }
  .disciple-dot.male { border-radius: 2px; }
  .disciple-dot.tian { background: #ff6b6b; color: #ff6b6b; }
  .disciple-dot.di { background: #dcdcaa; color: #dcdcaa; }
  .disciple-dot.xuan { background: #4ec9b0; color: #4ec9b0; }
  .disciple-dot.huang { background: #888; color: #888; }
  .right-panel { flex: 1; min-width: 480px; display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab {
    flex: 1; min-width: 64px; text-align: center; padding: 10px 2px; font-size: 12px;
    background: #241e14; border-radius: 8px; cursor: pointer;
    color: #7a6a50; transition: all 0.2s; position: relative;
  }
  .tab.active { background: #8a6a2a; color: #fff; }
  .tab:hover:not(.active) { background: #2e2618; color: #b8a888; }
  .tab .badge {
    position: absolute; top: 3px; right: 4px;
    background: #d44a2a; color: #fff;
    font-size: 10px; padding: 1px 5px; border-radius: 8px;
  }
  .panel { display: none; flex: 1; }
  .panel.active { display: block; }
  .row { display: flex; justify-content: space-between; font-size: 13px; margin: 7px 0; color: #b8a888; }
  .row span:last-child { color: #d4a857; font-weight: bold; font-family: monospace; }
  .bar-bg { height: 12px; background: #241e14; border-radius: 6px; overflow: hidden; margin: 6px 0 12px; }
  .bar-fill { height: 100%; width: 0%; transition: width 0.3s; border-radius: 6px; }
  #expFill { background: linear-gradient(90deg, #8a6a2a, #d4a857); }
  .btn {
    width: 100%; margin-top: 8px; padding: 10px; background: #8a6a2a; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: background 0.2s;
  }
  .btn:hover:not(:disabled) { background: #a8802a; }
  .btn:disabled { background: #2a2418; cursor: not-allowed; color: #5a4a30; }
  .btn.red { background: #8a2a2a; } .btn.red:hover:not(:disabled) { background: #b03a3a; }
  .btn.green { background: #2a7a3a; } .btn.green:hover:not(:disabled) { background: #3a9a4a; }
  .btn.purple { background: #6a2a8a; } .btn.purple:hover:not(:disabled) { background: #8a3aa8; }
  .btn.blue { background: #2a6a9a; } .btn.blue:hover:not(:disabled) { background: #3a8aba; }
  .scroll-area { max-height: 480px; overflow-y: auto; padding-right: 4px; }
  .scroll-area::-webkit-scrollbar { width: 6px; }
  .scroll-area::-webkit-scrollbar-thumb { background: #3a3020; border-radius: 3px; }
  .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: #241e14; border-radius: 8px; margin-bottom: 6px;
    font-size: 13px; border-left: 4px solid #4a3a20; gap: 10px; flex-wrap: wrap;
  }
  .item.天 { border-left-color: #ff6b6b; }
  .item.地 { border-left-color: #dcdcaa; }
  .item.玄 { border-left-color: #4ec9b0; }
  .item.黄 { border-left-color: #888; }
  .item .name { color: #d4c8b8; font-size: 14px; font-weight: bold; }
  .item .attr { color: #8a7a60; font-size: 12px; margin-top: 2px; }
  .item button {
    background: #8a6a2a; color: #fff; border: none; border-radius: 6px;
    padding: 5px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .item button:hover { background: #a8802a; }
  .item button.red { background: #8a2a2a; }
  .item button.blue { background: #2a6a9a; }
  .item button.purple { background: #6a2a8a; }
  .item button:disabled { background: #2a2418; color: #5a4a30; cursor: not-allowed; }
  .empty { color: #5a4a30; text-align: center; padding: 24px; font-size: 14px; }
  .event-card {
    background: #241e14; border: 1px solid #4a3a20; border-radius: 10px;
    padding: 14px; margin-bottom: 10px;
  }
  .event-card .evt-title { color: #d4a857; font-size: 15px; font-weight: bold; margin-bottom: 6px; }
  .event-card .evt-desc { color: #b8a888; font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
  .event-card .evt-options button {
    width: 100%; text-align: left; padding: 8px 12px; margin-bottom: 5px;
    background: #1a1610; color: #d4c8b8; border: 1px solid #3a3020; border-radius: 6px;
    font-size: 13px; cursor: pointer;
  }
  .event-card .evt-options button:hover { background: #2e2618; border-color: #8a6a2a; }
  .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .filter-bar button {
    padding: 6px 12px; font-size: 12px; background: #241e14; color: #b8a888;
    border: 1px solid #3a3020; border-radius: 6px; cursor: pointer;
  }
  .filter-bar button.active { background: #8a6a2a; color: #fff; }
  .disciples-collapse {
    background: #241e14; border-radius: 8px; padding: 10px 14px; margin-bottom: 6px;
    font-size: 13px; color: #b8a888; cursor: pointer;
  }
  .disciples-collapse:hover { background: #2e2618; }
  #log {
    height: 180px; overflow-y: auto; background: #0f0c08;
    border: 1px solid #2a2418; border-radius: 10px;
    padding: 12px 16px; font-size: 13px; line-height: 1.8;
    color: #9a8a70;
  }
  #log div { margin-bottom: 3px; }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: #3a3020; border-radius: 3px; }
  .rare { color: #4ec9b0; } .epic { color: #c586c0; } .legend { color: #dcdcaa; font-weight: bold; }
  .danger { color: #f14c4c; } .gold { color: #ffd700; }
  .myth { color: #ff6b6b; font-weight: bold; }
  .tian { color: #ff6b6b; } .di { color: #dcdcaa; } .xuan { color: #4ec9b0; } .huang { color: #888; }
  .male { color: #6ab0ff; } .female { color: #ff8cd8; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 998;
    display: flex; justify-content: center; align-items: center;
  }
  .modal {
    background: #1a1610; border: 1px solid #8a6a2a; border-radius: 14px;
    padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9);
  }
  .modal h3 { color: #d4a857; font-size: 18px; margin-bottom: 14px; text-align: center; letter-spacing: 3px; }
  .modal .row { font-size: 14px; margin: 8px 0; }
  .modal .close-btn {
    width: 100%; margin-top: 16px; padding: 10px; background: #8a6a2a; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .modal .close-btn:hover { background: #a8802a; }
  .toast {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    background: #241e14; color: #d4a857; border: 1px solid #8a6a2a;
    border-radius: 10px; padding: 12px 24px; font-size: 14px; z-index: 999;
    box-shadow: 0 6px 24px rgba(0,0,0,0.9);
    animation: toastIn 0.3s ease;
  }
  @keyframes toastIn { from { opacity: 0; top: 0; } to { opacity: 1; top: 30px; } }
  .sync-status {
    display: flex; justify-content: center; align-items: center;
    font-size: 12px; color: #8a7a60; margin-top: 8px; gap: 8px;
  }
  .sync-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #5a4a30; }
  .sync-status .dot.ok { background: #4ec9b0; box-shadow: 0 0 8px #4ec9b0; }
  .sync-status .dot.err { background: #f14c4c; box-shadow: 0 0 8px #f14c4c; }
  .equip-slot {
    display: inline-block; padding: 4px 8px; margin: 2px; border-radius: 4px;
    background: #1a1610; border: 1px solid #3a3020; font-size: 11px;
    cursor: pointer;
  }
  .equip-slot.凡品 { border-color: #444; }
  .equip-slot.灵品 { border-color: #4ec9b0; color: #4ec9b0; }
  .equip-slot.宝品 { border-color: #c586c0; color: #c586c0; }
  .equip-slot.仙品 { border-color: #dcdcaa; color: #dcdcaa; }
  .equip-slot.神品 { border-color: #ff6b6b; color: #ff6b6b; }
  .equip-slot.empty { border-color: #444; color: #444; font-style: italic; }
  .realm-tag {
    display: inline-block; padding: 1px 6px; border-radius: 4px;
    font-size: 11px; margin-left: 4px;
    background: #1a1610; border: 1px solid #4a3a20;
  }
  .realm-tag.r0 { color: #9a8a70; border-color: #5a4a30; }
  .realm-tag.r1 { color: #4ec9b0; border-color: #4ec9b0; }
  .realm-tag.r2 { color: #6ab0ff; border-color: #6ab0ff; }
  .realm-tag.r3 { color: #c586c0; border-color: #c586c0; }
  .realm-tag.r4 { color: #dcdcaa; border-color: #dcdcaa; }
  .realm-tag.r5 { color: #ffa500; border-color: #ffa500; }
  .realm-tag.r6 { color: #ff6b6b; border-color: #ff6b6b; }
  .realm-tag.r7 { color: #ff2d95; border-color: #ff2d95; }
  .realm-tag.r8 { color: #ffd700; border-color: #ffd700; font-weight: bold; }
  .saint-card {
    background: linear-gradient(135deg, #2a1f10 0%, #1a1610 100%);
    border: 1px solid #8a6a2a; border-radius: 10px;
    padding: 14px; margin-bottom: 10px;
  }
  .saint-card .sc-title { color: #d4a857; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
  .saint-card .sc-desc { color: #b8a888; font-size: 12px; margin-bottom: 8px; line-height: 1.6; }
  .saint-card .sc-opponents { font-size: 12px; color: #8a7a60; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div class="sect-name">宗 门 经 营 录</div>
    <div class="resources">
      <span>🏯 <b id="topSect">九流一阶</b></span>
      <span>⭐ <b id="topExp">0</b></span>
      <span>💎 <b id="topGold">0</b></span>
      <span>🌿 <b id="topHerb">0</b></span>
      <span>⛏️ <b id="topOre">0</b></span>
      <span>👤 <b id="topDisciple">0</b></span>
    </div>
  </div>

  <div class="main-layout">
    <div class="map-area" id="mapArea">
      <div class="map-bg-stars"></div>
      <div class="map-bg-mountain"></div>
    </div>

    <div class="right-panel">
      <div class="tabs">
        <div class="tab active" data-tab="main">宗门</div>
        <div class="tab" data-tab="disciples">弟子</div>
        <div class="tab" data-tab="saint">圣子</div>
        <div class="tab" data-tab="events">事件<span class="badge" id="eventBadge" style="display:none">0</span></div>
        <div class="tab" data-tab="buildings">建筑</div>
        <div class="tab" data-tab="skills">功法</div>
        <div class="tab" data-tab="secret">秘境</div>
        <div class="tab" data-tab="shop">坊市</div>
        <div class="tab" data-tab="craft">炼丹炼器</div>
        <div class="tab" data-tab="war">宗门战</div>
      </div>

      <div class="panel active" id="panel-main">
        <div class="row"><span>宗门等级</span><span id="sectLevel">九流一阶</span></div>
        <div class="row"><span>宗门声望</span><span id="sectExp">0 / 100</span></div>
        <div class="bar-bg"><div class="bar-fill" id="expFill"></div></div>
        <div class="row"><span>宗门战力</span><span id="sectPower">0</span></div>
        <div class="row"><span>传承次数</span><span id="genCount">0</span></div>
        <div class="row"><span>弟子总数</span><span id="discipleTotal">0 / 1441</span></div>
        <div class="row"><span>最高境界</span><span id="topRealm">—</span></div>
        <button class="btn green" id="meditateBtn">全体弟子闭关修炼（+50% 当前层修为）</button>
        <button class="btn" id="autoRecruitBtn">自动招募：开</button>
        <button class="btn" id="manualSaveBtn">手动保存（本地 + 云端）</button>
        <button class="btn purple" id="reincarnBtn" disabled>立新掌门（传承）</button>
      </div>

      <div class="panel" id="panel-disciples">
        <div class="filter-bar" id="discipleFilter">
          <button class="active" data-filter="all">全部</button>
          <button data-filter="杂役">杂役</button>
          <button data-filter="外门">外门</button>
          <button data-filter="内门">内门</button>
          <button data-filter="核心">核心</button>
          <button data-filter="圣子">圣子/圣女</button>
          <button data-filter="长老">长老</button>
        </div>
        <div class="filter-bar" id="discipleFilter2">
          <button class="active" data-qfilter="all">所有品阶</button>
          <button data-qfilter="天">天阶</button>
          <button data-qfilter="地">地阶</button>
          <button data-qfilter="玄">玄阶</button>
          <button data-qfilter="黄">黄阶</button>
        </div>
        <div class="filter-bar" id="discipleFilter3">
          <button class="active" data-rfilter="all">所有境界</button>
          <button data-rfilter="0">炼气</button>
          <button data-rfilter="1">筑基</button>
          <button data-rfilter="2">金丹</button>
          <button data-rfilter="3">元婴</button>
          <button data-rfilter="4">化神</button>
          <button data-rfilter="5">炼虚</button>
          <button data-rfilter="6">合体</button>
          <button data-rfilter="7">大乘</button>
          <button data-rfilter="8">渡劫</button>
        </div>
        <div class="scroll-area" id="discipleList"></div>
        <button class="btn red" id="batchManageBtn">批量管理</button>
      </div>

      <div class="panel" id="panel-saint">
        <div class="row"><span>今日圣子争夺次数</span><span id="saintChances">3 / 3</span></div>
        <div class="row"><span>下届圣子</span><span id="nextSaint">——</span></div>
        <div class="scroll-area" id="saintList"></div>
        <button class="btn purple" id="saintTournamentBtn">召开圣子争夺大会</button>
      </div>

      <div class="panel" id="panel-events">
        <div class="row"><span>待处理事件</span><span id="eventCount">0 / 10</span></div>
        <div class="scroll-area" id="eventList"></div>
      </div>

      <div class="panel" id="panel-buildings">
        <div class="scroll-area" id="buildingList"></div>
      </div>

      <div class="panel" id="panel-skills">
        <div class="row"><span>已学功法</span><span id="skillCount">0 / 16</span></div>
        <div class="scroll-area" id="skillList"></div>
      </div>

      <div class="panel" id="panel-secret">
        <div class="row"><span>当前秘境层数</span><span id="secretFloor">1 / 5</span></div>
        <div class="row"><span>推荐战力</span><span id="secretNeed">500</span></div>
        <div class="row"><span>弟子体力</span><span id="secretBody">—</span></div>
        <button class="btn green" id="exploreBtn">派遣探索（5 名弟子，各 -20 体力）</button>
        <div class="scroll-area" id="secretLog" style="margin-top:8px;"></div>
      </div>

      <div class="panel" id="panel-shop">
        <div class="row"><span>累计招募</span><span id="recruitCount">0</span></div>
        <div class="row"><span>距地阶保底</span><span id="pityDi">10</span></div>
        <div class="row"><span>距天阶保底</span><span id="pityTian">100</span></div>
        <div class="scroll-area" id="shopList"></div>
      </div>

      <div class="panel" id="panel-craft">
        <div class="row"><span>药材</span><span id="craftHerb">0</span></div>
        <div class="row"><span>矿石</span><span id="craftOre">0</span></div>
        <button class="btn green" id="alchemyBtn">炼丹（100 药材 + 50 灵石）</button>
        <button class="btn blue" id="forgeBtn">炼器（100 矿石 + 50 灵石）</button>
        <div class="scroll-area" id="craftLog" style="margin-top:8px;"></div>
      </div>

      <div class="panel" id="panel-war">
        <div class="row"><span>下次宗门战</span><span id="warTimer">--:--</span></div>
        <div class="scroll-area" id="warList"></div>
      </div>
    </div>
  </div>

  <div id="log"></div>

  <div class="sync-status">
    <span class="dot" id="syncDot"></span>
    <span id="syncText">云端：未连接</span>
  </div>
</div>

<script>
// ==================== 境界体系 ====================
const REALMS = [
  { name: "炼气",  mult: 1.0,   color: "r0" },
  { name: "筑基",  mult: 2.0,   color: "r1" },
  { name: "金丹",  mult: 4.0,   color: "r2" },
  { name: "元婴",  mult: 8.0,   color: "r3" },
  { name: "化神",  mult: 16.0,  color: "r4" },
  { name: "炼虚",  mult: 32.0,  color: "r5" },
  { name: "合体",  mult: 64.0,  color: "r6" },
  { name: "大乘",  mult: 128.0, color: "r7" },
  { name: "渡劫",  mult: 256.0, color: "r8" },
];
const LAYERS = ["一层","二层","三层","四层","五层","六层","七层","八层","九层"];

// 每层目标耗时（秒）—— 直接查表，81 个阶段
const LAYER_TIME = [
  // 炼气（0-8）：2 分钟
  120,120,120,120,120,120,120,120,120,
  // 筑基（9-17）：8 分钟
  480,480,480,480,480,480,480,480,480,
  // 金丹（18-26）：45 分钟
  2700,2700,2700,2700,2700,2700,2700,2700,2700,
  // 元婴（27-35）：3 小时
  10800,10800,10800,10800,10800,10800,10800,10800,10800,
  // 化神（36-44）：10 小时

function levelNeed(realm, layer) {
  const total = realm * 9 + (layer - 1);

}

// ==================== 工具函数 ====================
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fmt(n) {
  const num = Number(n);
  if (!isFinite(num)) return "0";
  if (num >= 100000000) return (num / 100000000).toFixed(2) + "亿";
  if (num >= 10000) return (num / 10000).toFixed(2) + "万";
  return Math.floor(num).toLocaleString("en-US");
}
function log(msg, cls = "") {
  const logEl = document.getElementById("log");
  if (!logEl) return;
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.children.length > 120) logEl.removeChild(logEl.firstChild);
}
function toast(msg) {
  const div = document.createElement("div");
  div.className = "toast";
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2500);
}
function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

function normalizeSkills(skills) {
  const out = {};
  Object.keys(skills || {}).forEach(k => {
    const v = skills[k];
    if (v === true) out[k] = { level: 1 };
    else if (typeof v === "number") out[k] = { level: v };
    else if (v && typeof v === "object") out[k] = { level: Number(v.level) || 0 };
  });

}
function normalizeDisciples(list) {

    let realm = typeof d.realm === "number" ? d.realm : null;
    let layer = typeof d.layer === "number" ? d.layer : null;
    if (realm === null) {
      const lv = d.level || 1;
      if (lv >= 100) {

        realm = 8; layer = 9;
      } else {
        // 按旧等级映射到 81 阶段
        const total = Math.min(80, Math.floor((lv - 1) / 100 * 81));
        realm = Math.floor(total / 9);
        layer = (total % 9) + 1;
      }

    return {

      name: d.name || "无名",
      gender: d.gender || "male",

      expNeed: typeof d.expNeed === "number" ? d.expNeed : levelNeed(realm, layer),
      breakthroughReady: !!d.breakthroughReady,
      hp: typeof d.hp === "number" ? d.hp : 100,
      maxHp: d.maxHp || 100,

}

// ==================== 弟子 ====================
function rollQuality() {
  const total = QUALITIES.reduce((s, q) => s + q.weight, 0);
  let r = Math.random() * total;
  for (const q of QUALITIES) {
    if (r < q.weight) return q;
    r -= q.weight;
  }
  return QUALITIES[QUALITIES.length - 1];
}
function generateDisciple(forceQuality) {
  const gender = Math.random() < 0.5 ? "male" : "female";
  const surname = pick(SURNAME);
  const given = gender === "male" ? pick(MALE_GIVEN) : pick(FEMALE_GIVEN);
  const q = forceQuality ? QUALITIES.find(x => x.name === forceQuality) : rollQuality();
  const cls = pick(CLASSES);
  return {
    id: Date.now() + Math.random(),
    name: surname + given,
    gender,
    quality: q.name,
    qualityMult: q.mult,
    taskRate: q.taskRate,

    classKey: cls.key,
    className: cls.name,

    classArmor: cls.armor,
    classAccessory: cls.accessory,
    realm: 0, layer: 1,
    exp: 0, expNeed: levelNeed(0, 1),
    breakthroughReady: false,
    hp: 100, maxHp: 100, loyalty: 70,
    status: "修炼中", role: "杂役",
    task: null, taskStart: 0, taskEnd: 0,
    mapX: 0.30, mapY: 0.80,

function getDiscipleMax(role) {
  const limits = {
    杂役: 10 + (state.buildings.dorm || 0) * 100,
    外门: 300, 内门: 100, 核心: 20, 圣子: 6, 长老: 10
  };
  return limits[role] || 0;
}
function getDiscipleCount(role) {
  return state.disciples.filter(d => d.role === role && d.hp > 0).length;
}
function addDisciple(d, role = "杂役", ignoreLimit = false) {
  const max = getDiscipleMax(role);
  const cur = getDiscipleCount(role);
  if (!ignoreLimit && cur >= max) return false;
  d.role = role;
  state.disciples.push(d);
  return true;
}

function getCultivateSpeed(d) {
  let s = 1.0;
  s *= 1 + (state.buildings.library || 0) * 0.10;
  const sb = getSkillBonus();
  s *= 1 + (sb.exp || 0);
  s *= 1 + (d.quality === "天" ? 1.0 : d.quality === "地" ? 0.6 : d.quality === "玄" ? 0.3 : 0);
  s *= 1 + (d.loyalty - 50) / 200;
  s *= Math.pow(1.15, d.realm || 0);
  s *= 1 + ((d.layer || 1) - 1) * 0.03;
  // 转职加成
  if (d.subclass) {
    const sub = findSubclass(d);
    if (sub && sub.effect.exp) s *= 1 + sub.effect.exp;
  }
  return s;
}

function findSubclass(d) {
  const list = SUBCLASSES[d.classKey] || [];
  return list.find(x => x.key === d.subclass) || null;
}

function gainExp(d, amount) {
  if (d.hp <= 0 || d.role === "长老") return;
  d.exp += amount;
  while (d.exp >= d.expNeed) {
    if (d.layer < 9) {
      d.exp -= d.expNeed;
      d.layer++;
      d.expNeed = levelNeed(d.realm, d.layer);
      if (d.layer === 9) {
        d.breakthroughReady = true;
        log(`⭐ 弟子【${d.name}】已至【${getRealmName(d)}】圆满，等待突破`, "epic");
      }
    } else {
      d.exp = d.expNeed;
      d.breakthroughReady = true;
      break;
    }
  }
}

function tryBreakthrough(d) {
  if (!d.breakthroughReady || d.layer < 9) return false;
  if (d.realm >= REALMS.length - 1) return false;
  const cost = BREAKTHROUGH_COST[d.realm];
  if (!cost) return false;
  if (state.gold < cost.gold || state.herb < cost.herb) return false;
  state.gold -= cost.gold;
  state.herb -= cost.herb;

  const rate = Math.min(0.95, 0.5 + d.qualityMult * 0.08 + (d.loyalty - 70) / 300);
  if (Math.random() < rate) {
    d.realm++;
    d.layer = 1;
    d.exp = 0;
    d.expNeed = levelNeed(d.realm, 1);
    d.breakthroughReady = false;
    d.maxHp = Math.floor(100 * REALMS[d.realm].mult * 0.5 + 100);
    d.hp = d.maxHp;
    log(`✨ 弟子【${d.name}】突破成功，晋升【${getRealmName(d)}】！`, "myth");
    toast(`✨ ${d.name} 突破至 ${getRealmName(d)}`);
    return true;
  } else {
    d.breakthroughReady = false;
    d.exp = 0;
    d.hp = Math.max(1, Math.floor(d.hp * 0.6));
    d.loyalty = Math.max(0, d.loyalty - 3);
    log(`💥 弟子【${d.name}】突破失败，境界跌回【${getRealmName(d)}】`, "danger");
    return false;
  }
}

function autoBreakthrough() {
  const now = Date.now();
  if (now - state._lastBreakthrough < 30000) return;
  state._lastBreakthrough = now;
  state.disciples.forEach(d => {
    if (d.hp <= 0 || d.role === "长老") return;
    if (!d.breakthroughReady || d.layer < 9) return;
    if (d.realm >= REALMS.length - 1) return;
    tryBreakthrough(d);
  });
}

function getDisciplePower(d) {
  if (d.hp <= 0) return 0;
  const cls = CLASSES.find(c => c.key === d.classKey) || CLASSES[0];
  const realm = REALMS[Math.min(d.realm || 0, REALMS.length - 1)];
  const total = getTotalLayer(d);
  const base = (20 + total * 15) * realm.mult;
  const arenaBonus = 1 + (state.buildings.arena || 0) * 0.03;
  const sb = getSkillBonus();
  let p = base * d.qualityMult * cls.powerMult * arenaBonus;
  p *= (1 + (sb.power || 0));
  if (d.classKey === "jian") p *= (1 + (sb.jian || 0));
  if (d.loyalty >= 100) p *= 1.1;
  // 转职加成
  const sub = findSubclass(d);
  if (sub) {
    if (sub.effect.power) p *= 1 + sub.effect.power;
    if (sub.effect.jian && d.classKey === "jian") p *= 1 + sub.effect.jian;
  }
  if (d.equipment) {
    ["weapon","armor","accessory"].forEach(slot => {
      const eq = d.equipment[slot];
      if (eq) p += eq.power * realm.mult;
    });
  }
  return Math.floor(p);
}
function getSectPower() {
  return state.disciples.reduce((s, d) => s + getDisciplePower(d), 0);
}
function getTopRealm() {
  let best = -1, bestName = "—";
  state.disciples.forEach(d => {
    if (d.hp <= 0) return;
    const t = getTotalLayer(d);
    if (t > best) { best = t; bestName = getRealmName(d); }
  });
  return bestName;
}

function getSkillBonus() {
  const bonus = { power: 0, hp: 0, exp: 0, gold: 0, herb: 0, dan: 0, jian: 0, loyalty: 0, forge: 0 };
  Object.entries(state.skills || {}).forEach(([key, data]) => {
    const s = SKILLS.find(x => x.key === key);
    if (!s) return;
    const lv = (data && data.level) || 0;
    Object.entries(s.effect).forEach(([k, v]) => {
      bonus[k] = (bonus[k] || 0) + v * lv;
    });
  });
  return bonus;
}

// ==================== 装备 ====================
function generateEquip(forceQuality) {
  const quality = forceQuality
    ? EQUIP_QUALITY.find(q => q.name === forceQuality)
    : (() => {
        const r = Math.random();
        if (r < 0.55) return EQUIP_QUALITY[0];
        if (r < 0.85) return EQUIP_QUALITY[1];
        if (r < 0.97) return EQUIP_QUALITY[2];
        if (r < 0.995) return EQUIP_QUALITY[3];
        return EQUIP_QUALITY[4];
      })();
  const slotIdx = rand(0, 2);
  const slot = ["weapon", "armor", "accessory"][slotIdx];
  let name;
  if (slot === "weapon") { const wType = pick(Object.keys(WEAPON_NAMES)); name = pick(WEAPON_NAMES[wType]); }
  else if (slot === "armor") { const aType = pick(Object.keys(ARMOR_NAMES)); name = pick(ARMOR_NAMES[aType]); }
  else { const accType = pick(Object.keys(ACC_NAMES)); name = pick(ACC_NAMES[accType]); }
  const basePower = 10 + state.sectLevel * 8;
  const power = Math.floor(basePower * quality.mult * (0.8 + Math.random() * 0.4));
  return {
    id: Date.now() + Math.random(),
    name, slot,
    quality: quality.name,
    qualityColor: quality.color,
    power,
  };
}
function equipItem(d, item) {
  if (!d.equipment) d.equipment = { weapon: null, armor: null, accessory: null };
  const old = d.equipment[item.slot];
  if (old) state.inventory.push(old);
  d.equipment[item.slot] = item;
  state.inventory = state.inventory.filter(i => i.id !== item.id);
}
function isEquipMatchClass(item, d) {
  if (item.slot === "weapon") return item.name.includes(d.classWeapon);
  if (item.slot === "armor") return item.name.includes(d.classArmor);
  if (item.slot === "accessory") return item.name.includes(d.classAccessory);
  return true;
}
function isBetterEquip(newEq, oldEq) {
  if (!oldEq) return true;
  const order = { "凡品": 0, "灵品": 1, "宝品": 2, "仙品": 3, "神品": 4 };
  if (order[newEq.quality] > order[oldEq.quality]) return true;
  if (order[newEq.quality] === order[oldEq.quality] && newEq.power > oldEq.power) return true;
  return false;
}
function autoEquipDisciple(d) {
  if (d.hp <= 0 || d.role === "长老") return;
  if (!d.equipment) d.equipment = { weapon: null, armor: null, accessory: null };
  const candidates = state.inventory.filter(eq => isEquipMatchClass(eq, d));
  for (const eq of candidates) {
    const current = d.equipment[eq.slot];
    if (isBetterEquip(eq, current)) equipItem(d, eq);
  }
}
function autoEquipAll() { state.disciples.forEach(d => autoEquipDisciple(d)); }

// ==================== 升职 ====================
function tryPromote() {
  const now = Date.now();
  if (now - state._lastPromote < 10000) return;
  state._lastPromote = now;
  // 杂役 → 外门：筑基一层（realm>=1）
  for (const d of state.disciples) {
    if (d.role !== "杂役" || d.hp <= 0 || d.realm < 1 || d.loyalty < 60) continue;
    if (getDiscipleCount("外门") >= getDiscipleMax("外门")) break;
    d.role = "外门";
  }
  // 外门 → 内门：金丹一层（realm>=2）
  for (const d of state.disciples) {
    if (d.role !== "外门" || d.hp <= 0 || d.realm < 2 || d.loyalty < 80) continue;
    if (getDiscipleCount("内门") >= getDiscipleMax("内门")) break;
    d.role = "内门";
  }
  // 内门 → 核心：元婴一层（realm>=3）
  const cand3 = state.disciples.filter(d => d.role === "内门" && d.hp > 0 && d.realm >= 3 && d.loyalty >= 90);
  cand3.sort((a, b) => getDisciplePower(b) - getDisciplePower(a));
  for (const d of cand3) {
    if (getDiscipleCount("核心") >= getDiscipleMax("核心")) break;
    d.role = "核心";
  }
  // 核心 → 圣子：化神一层（realm>=4），但需要争夺，不自动升
  // 任何 → 长老：炼虚一层（realm>=5）
  for (const d of state.disciples) {
    if (d.role === "长老" || d.hp <= 0 || d.realm < 5) continue;
    if (getDiscipleCount("长老") >= getDiscipleMax("长老")) break;
    d.role = "长老"; d.task = null; d.status = "长老";
  }
}

// ==================== 任务 ====================
function autoAssignTasks() {
  const now = Date.now();
  if (now - state._lastAssign < 5000) return;
  state._lastAssign = now;
  state.disciples.forEach(d => {
    if (d.hp <= 0 || d.role === "长老") return;
    if (d.task && d.taskEnd && now < d.taskEnd) return;
    if (d.status === "生命垂危") return;
    if (!d.task) {
      let taskRate = d.taskRate;
      // 高境界弟子不再做低阶任务
      if (d.realm >= 3) taskRate *= 0.3;
      if (d.realm >= 5) taskRate *= 0.1;
      if (Math.random() < taskRate) {
        const cls = CLASSES.find(c => c.key === d.classKey);
        startTask(d, cls.task);
      } else {
        d.status = "修炼中";
        d.mapX = 0.30; d.mapY = 0.80;
      }
    }
  });
}
function startTask(d, taskName) {
  const task = TASKS[taskName];
  if (!task) return;
  d.task = taskName;
  d.taskStart = Date.now();
  d.taskEnd = Date.now() + task.time;
  d.status = taskName + "中";
  d.mapX = task.x; d.mapY = task.y;
}
function finishTask(d) {
  const task = TASKS[d.task];
  if (!task) { d.task = null; d.status = "修炼中"; return; }
  let risk = task.risk * (d.deathMult || 1);
  // 境界越高，风险越低
  risk *= Math.pow(0.7, d.realm);
  if (Math.random() < risk) {
    const elders = state.disciples.filter(x => x.role === "长老" && x.hp > 0);
    if (elders.length > 0 && Math.random() < 0.8) {
      log(`弟子【${d.name}】任务遇险，长老出手相救，已脱险`, "rare");
    } else {
      d.hp = 0; d.status = "死亡";
      if (d.equipment) {
        ["weapon", "armor", "accessory"].forEach(slot => {
          if (d.equipment[slot]) { state.inventory.push(d.equipment[slot]); d.equipment[slot] = null; }
        });
      }
      log(`弟子【${d.name}】（${d.quality}品 ${d.className}·${getRealmName(d)}）任务中陨落`, "danger");
      return;
    }
  }
  const sb = getSkillBonus();
  const gold = task.gold ? Math.floor(rand(task.gold[0], task.gold[1]) * (1 + (sb.gold||0))) : 0;
  const herb = task.herb ? Math.floor(rand(task.herb[0], task.herb[1]) * (1 + (sb.herb||0))) : 0;
  const ore = task.ore ? rand(task.ore[0], task.ore[1]) : 0;
  const exp = task.exp ? rand(task.exp[0], task.exp[1]) : 0;
  state.gold += gold; state.herb += herb; state.ore += ore;
  if (exp > 0) gainExp(d, exp);
  if (d.task === "历练") state.sectExp += rand(5, 30);
  d.task = null; d.status = "修炼中";
  d.mapX = 0.30; d.mapY = 0.80;
}

// ==================== 修炼 / 产出 ====================
function cultivate() {
  const now = Date.now();
  if (now - state._lastCultivate < 10000) return;
  state._lastCultivate = now;
  state.disciples.forEach(d => {
    if (d.hp <= 0 || d.role === "长老" || d.task) return;
    const speed = getCultivateSpeed(d);
    gainExp(d, 8 * speed);
  });
}
function produce() {
  const now = Date.now();
  const sb = getSkillBonus();
  if (now - state._lastGoldTick > 5000) {
    state._lastGoldTick = now;
    const base = (state.buildings.farm || 0) * 10 + state.disciples.filter(d => d.hp > 0).length * 1;
    state.gold += Math.floor(base * (1 + (sb.gold||0)) * (1 + state.legacyBonus));
  }
  if (now - state._lastHerbTick > 10000) {
    state._lastHerbTick = now;
    state.herb += Math.floor((state.buildings.garden || 0) * 5 * (1 + (sb.herb||0)));
  }
}
function produceSectExp() {
  const now = Date.now();
  if (now - state._lastSectExp < 5000) return;
  state._lastSectExp = now;
  let gain = 0;
  state.disciples.forEach(d => {
    if (d.hp <= 0) return;
    const total = getTotalLayer(d);
    gain += 0.05 + total * 0.02;
  });
  state.sectExp += gain;
}
function recoverBody() {
  const now = Date.now();
  if (now - state._lastBody < 60000) return;
  state._lastBody = now;
  state.disciples.forEach(d => {
    if (d.hp > 0 && d.body < d.maxBody) {
      d.body = Math.min(d.maxBody, d.body + 10);
    }

}

// ==================== 自动招募 ====================
function autoRecruit() {
  if (!state.autoRecruit) return;
  const now = Date.now();
  if (now - state._lastAutoRecruit < 10000) return;
  state._lastAutoRecruit = now;
  const d = generateDisciple();
  if (d.quality === "天" || d.quality === "地") {
    d.quality = "玄"; d.qualityMult = 1.6;
    d.taskRate = 0.5; d.deathMult = 1.0;
  }
  const ok = addDisciple(d);
  if (!ok) {
    if (now - (state._lastFullWarn || 0) > 60000) {
      state._lastFullWarn = now;
      log("杂役已满，无法自动招募（升级弟子居可扩容）", "rare");
    }
  }
}

// ==================== 忠诚 / 互动 ====================
function checkLoyalty() {
  const now = Date.now();
  if (now - state._lastLoyalty < 30000) return;
  state._lastLoyalty = now;
  state.disciples.forEach(d => {
    if (d.hp <= 0 || d.role === "长老") return;
    if (d.loyalty < 30 && Math.random() < 0.05) {
      state.disciples = state.disciples.filter(x => x.id !== d.id);
      log(`弟子【${d.name}】叛逃出宗`, "danger");
    } else if (d.loyalty < 10 && Math.random() < 0.2) {
      state.disciples = state.disciples.filter(x => x.id !== d.id);
      log(`弟子【${d.name}】叛逃出宗`, "danger");
    }
  });
}
function checkInteraction() {
  const now = Date.now();
  if (now - state._lastInteraction < 5 * 60 * 1000) return;
  state._lastInteraction = now;
  const alive = state.disciples.filter(d => d.hp > 0 && d.role !== "长老" && !d.partner && !d.swornBrother);
  if (alive.length < 2) return;
  for (let i = 0; i < alive.length; i++) {
    const a = alive[i];
    if (a.partner || a.swornBrother) continue;
    for (let j = i + 1; j < alive.length; j++) {
      const b = alive[j];
      if (b.partner || b.swornBrother) continue;
      if (a.loyalty < 70 || b.loyalty < 70) continue;
      if (a.gender !== b.gender && Math.random() < 0.1) {
        a.partner = b.id; b.partner = a.id;
        log(`❤ 弟子【${a.name}】与【${b.name}】结为道侣`, "epic");
        return;
      }
      if (a.gender === b.gender && Math.random() < 0.08) {
        a.swornBrother = b.id; b.swornBrother = a.id;
        log(`🤝 弟子【${a.name}】与【${b.name}】结为异姓兄弟`, "rare");
        return;
      }
    }
  }
}

// ==================== 炼丹 / 炼器 ====================
function doAlchemy() {
  if (state.herb < 100 || state.gold < 50) { log("药材或灵石不足", "danger"); return; }
  state.herb -= 100; state.gold -= 50;
  const sb = getSkillBonus();
  const danMult = 1 + (sb.dan || 0);
  const roll = Math.random() * danMult;
  if (roll < 0.6) {
    state.disciples.forEach(d => { if (d.hp > 0) d.hp = d.maxHp; });
    log(`🧪 炼出【疗伤丹】，全体弟子恢复满血`, "gold");
    addCraftLog("🧪 疗伤丹 ×1", "gold");
  } else if (roll < 0.9) {
    const d = state.disciples.filter(x => x.hp > 0 && x.role !== "长老").sort((a, b) => getTotalLayer(a) - getTotalLayer(b))[0];
    if (d) {
      const add = Math.max(1, Math.floor(d.expNeed * 0.3 * danMult));
      gainExp(d, add);
      log(`🧪 炼出【聚气丹】，弟子【${d.name}】修为 +${fmt(add)}`, "epic");
      addCraftLog("🧪 聚气丹 ×1", "epic");
    }
  } else {
    const d = state.disciples.filter(x => x.hp > 0 && x.role !== "长老" && x.quality !== "天").sort((a, b) => b.qualityMult - a.qualityMult)[0];
    if (d) {
      const order = ["黄", "玄", "地", "天"];
      const idx = order.indexOf(d.quality);
      if (idx < order.length - 1) {
        const newQ = order[idx + 1];
        const qDef = QUALITIES.find(q => q.name === newQ);
        d.quality = newQ; d.qualityMult = qDef.mult;
        d.taskRate = qDef.taskRate; d.deathMult = qDef.deathMult;
        log(`🧪 炼出【洗髓丹】，弟子【${d.name}】资质提升到 ${newQ}品`, "myth");
        addCraftLog("🧪 洗髓丹 ×1", "myth");
      }
    }
  }
}
function doForge() {
  if (state.ore < 100 || state.gold < 50) { log("矿石或灵石不足", "danger"); return; }
  state.ore -= 100; state.gold -= 50;
  const eq = generateEquip();
  state.inventory.push(eq);
  log(`⚒️ 炼出【${eq.quality}·${eq.name}】，战力 +${eq.power}`, eq.qualityColor);
  addCraftLog(`⚒️ ${eq.quality}·${eq.name} +${eq.power}`, eq.qualityColor);
  autoEquipAll();
}
function addCraftLog(text, cls) {
  const el = document.getElementById("craftLog");
  if (!el) return;
  const div = document.createElement("div");
  div.className = "item " + (cls || "");
  div.innerHTML = `<div style="flex:1;">${text}</div>`;
  el.insertBefore(div, el.firstChild);
  while (el.children.length > 30) el.removeChild(el.lastChild);
}

// ==================== 秘境 ====================
function exploreSecret() {
  const floor = Math.min(state.secretFloor, SECRET_FLOORS.length - 1);
  const cfg = SECRET_FLOORS[floor];
  const team = state.disciples
    .filter(d => d.hp > 0 && d.role !== "长老" && d.body >= 20)
    .sort((a, b) => getDisciplePower(b) - getDisciplePower(a))
    .slice(0, 5);
  if (team.length < 3) { log("至少需要 3 名体力充足的弟子", "danger"); return; }
  const teamPower = team.reduce((s, d) => s + getDisciplePower(d), 0);
  if (teamPower < cfg.need) { log(`战力不足（需要 ${fmt(cfg.need)}，当前 ${fmt(teamPower)}）`, "danger"); return; }
  team.forEach(d => { d.body = Math.max(0, d.body - 20); });
  const reward = {};
  Object.entries(cfg.reward).forEach(([k, range]) => {
    reward[k] = rand(range[0], range[1]);
  });
  state.gold += reward.gold || 0;
  state.herb += reward.herb || 0;
  state.ore += reward.ore || 0;
  // 经验分给队伍
  team.forEach(d => { gainExp(d, Math.floor((reward.exp || 0) / team.length)); });
  // 掉装备
  if (Math.random() < 0.4) {
    const eq = generateEquip();
    state.inventory.push(eq);
    log(`秘境掉落：${eq.quality}·${eq.name}`, eq.qualityColor);
  }
  // 受伤
  team.forEach(d => {
    if (Math.random() < 0.15) {
      d.hp = Math.max(1, Math.floor(d.hp * 0.5));
      log(`弟子【${d.name}】在秘境中受伤`, "danger");
    }
  });
  state.secretFloor = Math.min(state.secretFloor + 1, SECRET_FLOORS.length - 1);
  log(`秘境第 ${floor + 1} 层探索成功！灵石 +${fmt(reward.gold||0)}，药材 +${fmt(reward.herb||0)}，矿石 +${fmt(reward.ore||0)}`, "gold");
  addSecretLog(`✅ 第 ${floor+1} 层：灵石+${fmt(reward.gold||0)} 药材+${fmt(reward.herb||0)} 矿石+${fmt(reward.ore||0)}`, "gold");
  saveLocal(); scheduleCloudSave(); updateUI();
}
function addSecretLog(text, cls) {
  const el = document.getElementById("secretLog");
  if (!el) return;
  const div = document.createElement("div");
  div.className = "item " + (cls || "");
  div.innerHTML = `<div style="flex:1;">${text}</div>`;
  el.insertBefore(div, el.firstChild);
  while (el.children.length > 30) el.removeChild(el.lastChild);
}

// ==================== 转职 ====================
function doSubclass(d, subKey) {
  const sub = (SUBCLASSES[d.classKey] || []).find(x => x.key === subKey);
  if (!sub) return;
  // 需要化神一层（realm>=4）
  if (d.realm < 4) { log("需要化神一层以上才能转职", "danger"); return; }
  // 需要忠诚 90
  if (d.loyalty < 90) { log("忠诚不足 90，无法转职", "danger"); return; }
  // 消耗
  const cost = { gold: 100000, herb: 20000 };
  if (state.gold < cost.gold || state.herb < cost.herb) { log("灵石或药材不足", "danger"); return; }
  state.gold -= cost.gold; state.herb -= cost.herb;
  d.subclass = subKey;
  log(`🌀 弟子【${d.name}】转职为【${sub.name}】`, "myth");
  toast(`🌀 ${d.name} → ${sub.name}`);
  saveLocal(); scheduleCloudSave(); updateUI();
}

// ==================== 圣子争夺 ====================
function resetDailyIfNeeded() {
  const now = Date.now();
  if (!state.saintResetAt || now - state.saintResetAt > 24 * 3600 * 1000) {
    state.saintChances = 3;
    state.saintResetAt = now;
  }
}
function getSaintCandidates() {
  // 化神一层（realm>=4）且非长老、非圣子
  return state.disciples.filter(d =>
    d.hp > 0 &&
    d.role !== "长老" &&
    d.role !== "圣子" &&
    d.realm >= 4
  ).sort((a, b) => getDisciplePower(b) - getDisciplePower(a));
}
function saintTournament() {
  resetDailyIfNeeded();
  if (state.saintChances <= 0) {
    log("今日圣子争夺次数已用完", "danger");
    return;
  }
  const candidates = getSaintCandidates();
  if (candidates.length === 0) {
    log("暂无可参与圣子争夺的弟子（需化神一层以上）", "danger");
    return;
  }
  state.saintChances--;
  // 取最强 5 名作为挑战者
  const challengers = candidates.slice(0, 5);
  // 当前圣子若存在，也加入
  let champion = null;
  if (state.saint) {
    const s = state.disciples.find(x => x.id === state.saint && x.hp > 0);
    if (s) champion = s;
  }
  const all = champion ? [champion, ...challengers] : challengers;
  // 战斗：按战力 + 随机
  let winner = all[0];
  let bestScore = -1;
  all.forEach(d => {
    const score = getDisciplePower(d) * (0.8 + Math.random() * 0.4);
    if (score > bestScore) { bestScore = score; winner = d; }
  });
  // 原圣子降级为核心
  if (champion && champion.id !== winner.id) {
    champion.role = "核心";
    log(`👑 圣子【${champion.name}】在争夺中落败，降为核心弟子`, "rare");
  }
  // 新圣子
  if (winner.role !== "圣子") {
    winner.role = "圣子";
    winner.loyalty = Math.min(100, winner.loyalty + 10);
    state.saint = winner.id;
    log(`👑 弟子【${winner.name}】（${getRealmName(winner)}）成为新一任圣子！`, "myth");
    toast(`👑 ${winner.name} 成为圣子！`);
  } else {
    log(`👑 圣子【${winner.name}】成功卫冕`, "gold");
  }
  state.saintHistory.push({ at: Date.now(), winner: winner.name, realm: getRealmName(winner) });
  if (state.saintHistory.length > 20) state.saintHistory.shift();
  saveLocal(); scheduleCloudSave(); updateUI();
}

// ==================== 宗门战 ====================
const WAR_ENEMIES = ["青云门", "焚天宗", "万剑阁", "血煞教", "天机楼", "太虚观"];
function checkWar() {
  const now = Date.now();
  if (now < state.nextWarAt) return;
  if (state.disciples.filter(d => d.hp > 0).length < 3) return;
  const enemy = pick(WAR_ENEMIES);
  log(`⚔ ${enemy} 上门挑战！`, "danger");
  const myPower = getSectPower();
  const enemyPower = Math.floor(myPower * (0.6 + Math.random() * 0.8));
  if (myPower > enemyPower) {
    state.gold += 1000; state.sectExp += 200;
    log(`⚔ 击退【${enemy}】，声望 +200，灵石 +1000`, "gold");
    state.warHistory.push({ enemy, result: "win", at: now });
  } else {
    const d = state.disciples.filter(x => x.hp > 0 && x.role !== "长老").sort((a, b) => getDisciplePower(a) - getDisciplePower(b))[0];
    if (d) {
      d.hp = 0;
      if (d.equipment) {
        ["weapon", "armor", "accessory"].forEach(slot => {
          if (d.equipment[slot]) { state.inventory.push(d.equipment[slot]); d.equipment[slot] = null; }
        });
      }
      log(`⚔ 不敌【${enemy}】，弟子【${d.name}】战死`, "danger");
    }
    state.warHistory.push({ enemy, result: "lose", at: now });
  }
  state.nextWarAt = now + 3600 * 1000;
  renderWar();
}
function renderWar() {
  const list = document.getElementById("warList");
  if (!list) return;
  list.innerHTML = "";
  const timer = document.getElementById("warTimer");
  const diff = state.nextWarAt - Date.now();
  if (diff > 0) {
    const mins = Math.floor(diff / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    if (timer) timer.textContent = `${mins} 分 ${secs} 秒`;
  } else {
    if (timer) timer.textContent = "即将触发";
  }
  if (state.warHistory.length === 0) {
    list.innerHTML = '<div class="empty">暂无宗门战记录</div>';
    return;
  }
  state.warHistory.slice(-10).reverse().forEach(w => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div style="flex:1;">
        <div class="name">${w.enemy}</div>
        <div class="attr">${new Date(w.at).toLocaleString("zh-CN")}</div>
      </div>
      <div style="color:${w.result === "win" ? "#4ec9b0" : "#f14c4c"};">
        ${w.result === "win" ? "✓ 胜利" : "✗ 失败"}
      </div>
    `;
    list.appendChild(div);
  });
}

// ==================== 传承 ====================
function canReincarn() { return state.sectLevel >= SECT_LEVELS.length - 1; }
function doReincarn() {
  if (!canReincarn()) { log("境界不足，无法传承", "danger"); return; }
  if (!confirm("确定要立新掌门吗？将重置境界、弟子、灵石，但保留部分底蕴。")) return;
  const coreDisciples = state.disciples.filter(d => d.role === "核心" || d.role === "圣子").slice(0, 5);
  const keepGold = Math.floor(state.gold * 0.5);
  BUILDINGS.forEach(b => { state.buildings[b.key] = 0; });
  state.sectLevel = 0; state.sectExp = 0; state.gold = keepGold;
  state.herb = 0; state.ore = 0;
  state.generation++; state.legacyBonus += 0.1;
  state.disciples = coreDisciples.map(d => {
    d.role = "杂役"; d.realm = 0; d.layer = 1;
    d.exp = 0; d.expNeed = levelNeed(0, 1);
    d.breakthroughReady = false;
    d.hp = 100; d.maxHp = 100;
    d.task = null; d.status = "修炼中";
    d.mapX = 0.30; d.mapY = 0.80;
    d.subclass = null;
    return d;
  });
  const elder = generateDisciple();
  elder.name = "太上长老·" + state.generation;
  elder.role = "长老";
  elder.realm = 8; elder.layer = 9;
  elder.expNeed = levelNeed(8, 9);
  elder.hp = 100; elder.maxHp = 100;
  elder.loyalty = 100; elder.status = "长老";
  state.disciples.push(elder);
  state.inventory = [];
  state.saint = null;
  log(`★★★ 传承成功！第 ${state.generation} 代掌门诞生，全局加成 +${(state.legacyBonus*100).toFixed(0)}%`, "myth");
  toast(`★★★ 传承成功！第 ${state.generation} 代`);
  saveLocal(); scheduleCloudSave(); updateUI();
}

// ==================== 招募 ====================
function recruitN(n) {
  let tian = 0, di = 0, xuan = 0, huang = 0;
  const loyaltyBonus = getSkillBonus().loyalty || 0;
  for (let i = 0; i < n; i++) {
    state.recruitCount++; state.pityDi++; state.pityTian++;
    let forceQ = null;
    if (state.pityTian >= 100) { forceQ = "天"; state.pityTian = 0; }
    else if (state.pityDi >= 10) { forceQ = "地"; state.pityDi = 0; }
    const d = generateDisciple(forceQ);
    if (loyaltyBonus > 0) d.loyalty = Math.min(100, d.loyalty + loyaltyBonus);
    if (d.quality === "天") { tian++; state.pityTian = 0; }
    else if (d.quality === "地") { di++; state.pityDi = 0; }
    else if (d.quality === "玄") xuan++;
    else huang++;
    addDisciple(d, "杂役", true);
  }
  log(`招募 ${n} 次：天 ${tian} · 地 ${di} · 玄 ${xuan} · 黄 ${huang}`, "gold");
  if (tian > 0) toast(`🎉 抽到天阶弟子 ×${tian}！`);
  saveLocal(); scheduleCloudSave(); updateUI();
}
function healDisciple() {
  const d = state.disciples.find(x => x.hp > 0 && x.hp < x.maxHp * 0.5);
  if (!d) { log("没有受伤的弟子", "danger"); return; }
  d.hp = d.maxHp;
  log(`弟子【${d.name}】伤势痊愈`, "gold");
}
function reviveDisciple() {
  const d = state.disciples.find(x => x.hp <= 0);
  if (!d) { log("没有死亡的弟子", "danger"); return; }
  d.hp = Math.floor(d.maxHp * 0.5);
  d.loyalty = Math.max(0, d.loyalty - 20);
  d.status = "修炼中";
  log(`弟子【${d.name}】还魂复活（忠诚 -20）`, "gold");
}
function batchManage() {
  const choice = prompt("批量管理：\n1 = 遣散所有黄阶杂役\n2 = 遣散所有玄阶杂役\n3 = 遣散所有杂役\n4 = 遣散所有筑基以下杂役\n输入数字选择：");
  if (!choice) return;
  let targets = [], refund = 0;
  if (choice === "1") { targets = state.disciples.filter(d => d.role === "杂役" && d.quality === "黄"); refund = 5; }
  else if (choice === "2") { targets = state.disciples.filter(d => d.role === "杂役" && d.quality === "玄"); refund = 20; }
  else if (choice === "3") {
    targets = state.disciples.filter(d => d.role === "杂役");
    targets.forEach(d => {
      if (d.quality === "黄") refund += 5;
      else if (d.quality === "玄") refund += 20;
      else if (d.quality === "地") refund += 100;
      else if (d.quality === "天") refund += 500;
    });
  } else if (choice === "4") {
    targets = state.disciples.filter(d => d.role === "杂役" && d.realm < 1);
    refund = 5;
  } else return;
  if (targets.length === 0) { log("没有符合条件的弟子", "danger"); return; }
  const ids = new Set(targets.map(d => d.id));
  state.disciples = state.disciples.filter(d => !ids.has(d.id));
  if (choice === "1" || choice === "2" || choice === "4") refund *= targets.length;
  state.gold += refund;
  log(`遣散 ${targets.length} 名弟子，返还 ${refund} 灵石`, "gold");
  saveLocal(); scheduleCloudSave(); updateUI();
}

// ==================== 渲染 ====================
const MAP_W = 900, MAP_H = 600;
function onBuildingClick(b) {
  const lv = state.buildings[b.key] || 0;
  if (lv >= b.maxLv) { log(`${b.name} 已满级`, "danger"); return; }
  const cost = b.baseCost * (lv + 1) * 1.5;
  if (state.gold < cost) { log(`灵石不足（需要 ${fmt(cost)}）`, "danger"); return; }
  state.gold -= cost; state.buildings[b.key]++;
  log(`【${b.name}】升级到 Lv.${state.buildings[b.key]}`, "gold");
  saveLocal(); scheduleCloudSave(); updateUI();
}
function renderMap() {
  const map = document.getElementById("mapArea");
  if (!map) return;
  if (!map.dataset.buildingsDone) {
    BUILDINGS.forEach(b => {
      const el = document.createElement("div");
      el.className = "building";
      el.dataset.build = b.key;
      el.style.left = (b.x * MAP_W) + "px";
      el.style.top  = (b.y * MAP_H) + "px";
      el.innerHTML = `<span class="b-icon">${b.icon}</span><div class="b-name">${b.name}</div><div class="b-lv">Lv.0</div>`;
      el.title = `${b.name} - ${b.desc}`;
      el.addEventListener("click", () => onBuildingClick(b));
      map.appendChild(el);
    });
    map.dataset.buildingsDone = "1";
  }
  BUILDINGS.forEach(b => {
    const el = map.querySelector(`.building[data-build="${b.key}"] .b-lv`);
    if (el) el.textContent = "Lv." + (state.buildings[b.key] || 0);
  });
  const alive = state.disciples.filter(d => d.hp > 0).slice(0, 100);
  const existing = new Map();
  map.querySelectorAll(".disciple-dot").forEach(el => existing.set(el.dataset.id, el));
  alive.forEach(d => {
    const key = String(d.id);
    let el = existing.get(key);
    if (!el) {
      el = document.createElement("div");
      el.className = "disciple-dot " + d.quality + (d.gender === "male" ? " male" : "");
      el.dataset.id = key;
      el.title = `${d.name} · ${getRealmName(d)} · ${d.role}`;
      map.appendChild(el);
    }
    el.style.left = (d.mapX * MAP_W) + "px";
    el.style.top  = (d.mapY * MAP_H) + "px";
    el.title = `${d.name} · ${getRealmName(d)} · ${d.role}`;
  });
  existing.forEach((el, id) => {
    if (!alive.some(d => String(d.id) === id)) el.remove();
  });
}
function updateDisciplePositions() {
  const map = document.getElementById("mapArea");
  if (!map) return;
  const alive = state.disciples.filter(d => d.hp > 0).slice(0, 100);
  const idMap = new Map(alive.map(d => [String(d.id), d]));
  map.querySelectorAll(".disciple-dot").forEach(el => {
    const d = idMap.get(el.dataset.id);
    if (d) {
      el.style.left = (d.mapX * MAP_W) + "px";
      el.style.top  = (d.mapY * MAP_H) + "px";
    } else {
      el.remove();
    }

function renderDisciples() {
  const list = document.getElementById("discipleList");
  if (!list) return;
  list.innerHTML = "";
  const roles = ["圣子", "长老", "核心", "内门", "外门", "杂役"];
  let filtered = state.disciples.filter(d => d.hp > 0);
  if (currentFilter !== "all") filtered = filtered.filter(d => d.role === currentFilter);
  if (currentQFilter !== "all") filtered = filtered.filter(d => d.quality === currentQFilter);
  if (currentRFilter !== "all") filtered = filtered.filter(d => d.realm === Number(currentRFilter));
  const groups = {};
  roles.forEach(r => groups[r] = []);
  filtered.forEach(d => { if (groups[d.role]) groups[d.role].push(d); });
  Object.keys(groups).forEach(r => groups[r].sort((a, b) => getDisciplePower(b) - getDisciplePower(a)));
  roles.forEach(role => {
    const arr = groups[role];
    if (arr.length === 0) return;
    const hasHighQuality = arr.some(d => d.quality === "天" || d.quality === "地");
    const showAll = ["圣子", "核心", "长老"].includes(role) || currentFilter === role || hasHighQuality;
    const toShow = showAll ? arr : arr.slice(0, 5);
    if (!showAll && arr.length > 5) {
      const div = document.createElement("div");
      div.className = "disciples-collapse";
      div.textContent = `▼ ${role}（${arr.length} 人，点击展开）`;
      div.addEventListener("click", () => {
        currentFilter = role;
        document.querySelectorAll("#discipleFilter button").forEach(b => b.classList.remove("active"));
        renderDisciples();
      });
      list.appendChild(div);
    }
    toShow.forEach(d => {
      const el = document.createElement("div");
      el.className = "item " + d.quality;
      const genderIcon = d.gender === "male" ? "♂" : "♀";
      const genderCls = d.gender === "male" ? "male" : "female";
      let partnerText = "";
      if (d.partner) { const p = state.disciples.find(x => x.id === d.partner); if (p) partnerText = ` ❤${p.name}`; }
      if (d.swornBrother) { const p = state.disciples.find(x => x.id === d.swornBrother); if (p) partnerText = ` 🤝${p.name}`; }
      let equipText = "";
      if (d.equipment) {
        const eqs = ["weapon", "armor", "accessory"].map(s => d.equipment[s]).filter(Boolean);
        if (eqs.length > 0) equipText = eqs.map(e => `<span class="equip-slot ${e.quality}">${e.quality}·${e.name}</span>`).join("");
      }
      const sub = findSubclass(d);
      const subText = sub ? ` · <span style="color:#c586c0;">${sub.name}</span>` : "";
      const progress = Math.min(100, (d.exp / d.expNeed) * 100).toFixed(0);
      el.innerHTML = `
        <div style="flex:1;min-width:0;">
          <div class="name">${d.name} <span class="${genderCls}">${genderIcon}</span>
            <span class="${d.quality === "天" ? "tian" : d.quality === "地" ? "di" : d.quality === "玄" ? "xuan" : "huang"}">${d.quality}品</span>
            · ${d.className}${subText} · ${d.role}${partnerText}</div>
          <div class="attr">
            <span class="realm-tag ${REALMS[d.realm].color}">${getRealmName(d)}</span>
            战力 ${fmt(getDisciplePower(d))} · 忠诚 ${d.loyalty} · 体力 ${d.body}/${d.maxBody}
          </div>
          <div class="attr">${d.task ? d.task + "中" : d.status} · 修为 ${fmt(d.exp)} / ${fmt(d.expNeed)}（${progress}%）${d.breakthroughReady ? ' <span style="color:#ffd700;">★可突破</span>' : ''}</div>
          ${equipText ? `<div style="margin-top:4px;">${equipText}</div>` : ""}
          ${d.realm >= 4 && !d.subclass ? `<div style="margin-top:4px;">${(SUBCLASSES[d.classKey]||[]).map(s => `<button class="equip-slot" data-sub="${s.key}" data-id="${d.id}" style="cursor:pointer;">转职 ${s.name}</button>`).join(" ")}</div>` : ""}
        </div>
      `;
      list.appendChild(el);
    });
  });
  if (filtered.length === 0) list.innerHTML = '<div class="empty">没有符合条件的弟子</div>';

  list.querySelectorAll("[data-sub]").forEach(btn => {
    btn.addEventListener("click", () => {
      const d = state.disciples.find(x => String(x.id) === btn.dataset.id);
      if (d) doSubclass(d, btn.dataset.sub);
    });
  });
}

    div.innerHTML = `<div style="flex:1;"><div class="name">${s.name} <span style="color:#888">[${s.tier}阶]</span> <span style="color:#d4a857;">Lv.${lv}/10</span></div><div class="attr">${s.desc}</div><div class="attr" style="color:#6affd8;">当前加成：${lv > 0 ? effectText : "无"}</div></div><button data-skill="${s.key}" ${isMax ? "disabled" : ""}>${isMax ? "满级" : (lv === 0 ? `学习 ${s.basePrice}` : `升级 ${Math.floor(upgradeCost)}`)}</button>`;

  });

    btn.addEventListener("click", () => {
      const s = SKILLS.find(x => x.key === btn.dataset.skill);
      const data = state.skills[s.key];
      const lv = data ? (data.level || 0) : 0;
      if (lv >= 10) return;
      const cost = lv === 0 ? s.basePrice : Math.floor(s.basePrice * (lv + 1) * 1.5);

      state.skills[s.key].level = lv + 1;
      log(`${lv === 0 ? "学会" : "升级"}功法【${s.name}】 Lv.${lv + 1}`, "gold");
      saveLocal(); scheduleCloudSave(); updateUI();
    });
  });

function spawnEvent() {

  if (now - state._lastEvent < 60000) return;
  state._lastEvent = now;

  if (Math.random() < 0.35) {

    state.events.push({ tplIdx: idx, at: now });

    log(`📜 新事件：【${tpl.type}】${tpl.title}`, "rare");
  }
}

// ==================== 离线收益 ====================
function offlineEarnings() {
  const last = parseInt(localStorage.getItem(TIME_KEY) || "0", 10);
  const now = Date.now();
  if (!last || isNaN(last)) return;
  const diffSec = Math.floor((now - last) / 1000);
  if (diffSec < 60) return;
  const capSec = Math.min(diffSec, 24 * 3600);
  const hours = Math.floor(capSec / 3600);
  const mins = Math.floor((capSec % 3600) / 60);
  const timeStr = hours > 0 ? `${hours} 小时 ${mins} 分钟` : `${mins} 分钟`;

  const sb = getSkillBonus();
  const reincMult = 1 + state.legacyBonus;
  const goldGain = Math.floor(capSec / 5 * ((state.buildings.farm||0) * 10 + 10) * (1 + (sb.gold||0)) * reincMult);
  const herbGain = Math.floor(capSec / 10 * (state.buildings.garden||0) * 5 * (1 + (sb.herb||0)));

  // 离线修为
  let totalExp = 0;
  state.disciples.forEach(d => {
    if (d.hp <= 0 || d.role === "长老") return;
    const speed = getCultivateSpeed(d);
    const exp = Math.floor(capSec / 10 * 8 * speed);
    totalExp += exp;
    gainExp(d, exp);
    if (d.breakthroughReady && d.layer >= 9) tryBreakthrough(d);
  });

  // 离线死亡
  const deadCount = { 天: 0, 地: 0, 玄: 0, 黄: 0 };
  state.disciples.filter(d => d.hp > 0 && d.role !== "长老").forEach(d => {
    const deathChance = 0.005 * (d.deathMult || 1) * Math.pow(0.7, d.realm);
    if (Math.random() < deathChance) {
      d.hp = 0;
      deadCount[d.quality] = (deadCount[d.quality] || 0) + 1;
      if (d.equipment) {
        ["weapon", "armor", "accessory"].forEach(slot => {
          if (d.equipment[slot]) { state.inventory.push(d.equipment[slot]); d.equipment[slot] = null; }
        });
      }
    }
  });

  state.gold += goldGain;
  state.herb += herbGain;

  const modal = document.createElement("div");
  modal.className = "modal-bg";
  modal.innerHTML = `
    <div class="modal">
      <h3>📦 离线收益汇总</h3>
      <div class="row"><span>离线时长</span><span>${timeStr}</span></div>
      <div class="row"><span>💎 灵石</span><span>+${fmt(goldGain)}</span></div>
      <div class="row"><span>🌿 药材</span><span>+${fmt(herbGain)}</span></div>
      <div class="row"><span>👤 弟子总修为</span><span>+${fmt(totalExp)}</span></div>
      ${deadCount.天 > 0 ? `<div class="row" style="color:#ff6b6b;"><span>💀 天阶死亡</span><span>${deadCount.天} 人</span></div>` : ""}
      ${deadCount.地 > 0 ? `<div class="row" style="color:#dcdcaa;"><span>💀 地阶死亡</span><span>${deadCount.地} 人</span></div>` : ""}
      ${deadCount.玄 > 0 ? `<div class="row" style="color:#4ec9b0;"><span>💀 玄阶死亡</span><span>${deadCount.玄} 人</span></div>` : ""}
      ${deadCount.黄 > 0 ? `<div class="row" style="color:#888;"><span>💀 黄阶死亡</span><span>${deadCount.黄} 人</span></div>` : ""}
      <button class="close-btn" id="closeModal">领 取</button>
    </div>
  `;
  document.body.appendChild(modal);
  modal.querySelector("#closeModal").addEventListener("click", () => {
    modal.remove();
    saveLocal(); scheduleCloudSave();
  });
}

// ==================== 主循环 ====================
function tick() {
  const now = Date.now();
  state.lastTick = now;
  state.disciples.forEach(d => {
    if (d.task && d.taskEnd && now >= d.taskEnd) finishTask(d);
  });
  autoAssignTasks();
  cultivate();
  produce();
  produceSectExp();
  autoRecruit();
  checkLoyalty();
  checkInteraction();
  spawnEvent();
  tryPromote();
  autoBreakthrough();
  recoverBody();
  checkWar();
  resetDailyIfNeeded();

  // 境界升级
  while (
    state.sectLevel < SECT_LEVELS.length - 1 &&
    state.sectExp >= SECT_NEED[state.sectLevel]
  ) {
    state.sectExp -= SECT_NEED[state.sectLevel];
    state.sectLevel++;
    log(`🎉 宗门升级！当前等级：${SECT_LEVELS[state.sectLevel]}`, "gold");
    toast(`🎉 宗门升级！${SECT_LEVELS[state.sectLevel]}`);
    saveLocal(); scheduleCloudSave();
  }

  updateUI();
  updateDisciplePositions();

  if (now - (state._lastCloudTick || 0) > 60000) {
    state._lastCloudTick = now;
    if (cloudReady) cloudSave();
  }
  if (now - (state._lastLocalTick || 0) > 60000) {
    state._lastLocalTick = now;
    saveLocal();
  }
}

// ==================== 启动 ====================
async function init() {
  const loaded = loadLocal();
  if (!loaded) {
    updateSyncStatus("", "云端：读取中…");
    try {
      const cloudState = await cloudLoad();
      if (cloudState) {
        cloudState.events = (cloudState.events || []).filter(e => typeof e.tplIdx === "number" && EVENT_TEMPLATES[e.tplIdx]);
        cloudState.skills = normalizeSkills(cloudState.skills);
        cloudState.disciples = normalizeDisciples(cloudState.disciples);
        log("本地无存档，从云端读取", "gold");
        Object.assign(state, cloudState);
        state.inventory = Array.isArray(state.inventory) ? state.inventory : [];
        state.warHistory = Array.isArray(state.warHistory) ? state.warHistory : [];
        state.saintHistory = Array.isArray(state.saintHistory) ? state.saintHistory : [];
        state.buildings = state.buildings || {};
        BUILDINGS.forEach(b => { if (typeof state.buildings[b.key] !== "number") state.buildings[b.key] = 0; });
        if (typeof state.secretFloor !== "number") state.secretFloor = 0;
        if (typeof state.saintChances !== "number") state.saintChances = 3;
        saveLocal();
      } else {
        addDisciple(generateDisciple());
        const elder = generateDisciple();
        elder.name = "太上长老";
        elder.role = "长老";
        elder.realm = 8; elder.layer = 9;
        elder.expNeed = levelNeed(8, 9);
        elder.hp = 100; elder.maxHp = 100;
        elder.loyalty = 100; elder.status = "长老";
        state.disciples.push(elder);
        log("你继承了一座破庙，开始了宗门经营之路……", "gold");
        log("提示：弟子会自动修炼、自动突破，事件会攒着等你处理。", "rare");
        log("★ 一位太上长老自愿镇守山门，监管弟子陨落。", "legend");
      }
    } catch (e) {
      addDisciple(generateDisciple());
      log("云端连接失败，开始新游戏", "danger");
    }
  } else {
    log("已从本地读取存档", "gold");
    try {
      const cloudState = await cloudLoad();
      if (cloudState) {
        cloudState.events = (cloudState.events || []).filter(e => typeof e.tplIdx === "number" && EVENT_TEMPLATES[e.tplIdx]);
        cloudState.skills = normalizeSkills(cloudState.skills);
        cloudState.disciples = normalizeDisciples(cloudState.disciples);
        const localTime = parseInt(localStorage.getItem(TIME_KEY) || "0", 10);
        const cloudTime = cloudState._saveTime || 0;
        if (cloudTime > localTime) {
          log("云端存档较新，使用云端存档", "gold");
          Object.assign(state, cloudState);
          state.inventory = Array.isArray(state.inventory) ? state.inventory : [];
          state.warHistory = Array.isArray(state.warHistory) ? state.warHistory : [];
          state.saintHistory = Array.isArray(state.saintHistory) ? state.saintHistory : [];
          state.buildings = state.buildings || {};
          BUILDINGS.forEach(b => { if (typeof state.buildings[b.key] !== "number") state.buildings[b.key] = 0; });
          if (typeof state.secretFloor !== "number") state.secretFloor = 0;
          if (typeof state.saintChances !== "number") state.saintChances = 3;
          saveLocal();
        } else {
          log("本地存档较新，跳过云端覆盖", "rare");
        }
      }
    } catch (e) {}
  }

  offlineEarnings();
  updateUI();
  cloudReady = true;
  updateSyncStatus("ok", "云端：已同步");
  setInterval(tick, 1000);
}

init();
</script>
</body>
</html>
