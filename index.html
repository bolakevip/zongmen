<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宗门经营录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

  #app {

  .title {

    text-shadow: 0 0 10px rgba(212,168,87,0.4);
  }
  .top-bar {
    display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px;
    background: #0f0c08; border: 1px solid #2a2418; border-radius: 6px;
    padding: 6px 8px; margin-bottom: 8px; color: #b8a888;
  }
  .top-bar span b { color: #d4a857; }

  .tabs { display: flex; gap: 3px; margin-bottom: 8px; flex-wrap: wrap; }
  .tab {
    flex: 1; min-width: 48px; text-align: center; padding: 6px 0; font-size: 11px;
    background: #241e14; border-radius: 6px; cursor: pointer; color: #7a6a50; transition: all 0.2s;
  }
  .tab.active { background: #8a6a2a; color: #fff; }
  .tab:hover:not(.active) { background: #2e2618; color: #b8a888; }
  .tab .badge {
    display: inline-block; background: #d44a2a; color: #fff;
    font-size: 9px; padding: 0 4px; border-radius: 6px; margin-left: 2px;
    vertical-align: top;
  }
  .panel { display: none; }
  .panel.active { display: block; }

  .row { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; color: #b8a888; }
  .row span:last-child { color: #d4a857; font-weight: bold; }
  .bar-bg { height: 8px; background: #241e14; border-radius: 4px; overflow: hidden; margin: 4px 0 8px; }
  .bar-fill { height: 100%; width: 0%; transition: width 0.3s; border-radius: 4px; }
  #expFill { background: linear-gradient(90deg, #8a6a2a, #d4a857); }

  #log {
    height: 120px; overflow-y: auto; background: #0f0c08; border: 1px solid #2a2418;
    border-radius: 6px; padding: 8px; font-size: 11px; line-height: 1.7; color: #9a8a70; margin-top: 8px;
  }
  #log div { margin-bottom: 2px; }
  #log::-webkit-scrollbar { width: 4px; }
  #log::-webkit-scrollbar-thumb { background: #3a3020; border-radius: 2px; }

  .rare { color: #4ec9b0; } .epic { color: #c586c0; } .legend { color: #dcdcaa; font-weight: bold; }
  .danger { color: #f14c4c; } .gold { color: #ffd700; }
  .myth { color: #ff6b6b; font-weight: bold; text-shadow: 0 0 6px #ff6b6b; }
  .tian { color: #ff6b6b; } .di { color: #dcdcaa; } .xuan { color: #4ec9b0; } .huang { color: #888; }
  .male { color: #6ab0ff; } .female { color: #ff8cd8; }

  .btn {
    width: 100%; margin-top: 6px; padding: 7px; background: #8a6a2a; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-size: 12px; transition: background 0.2s;
  }
  .btn:hover:not(:disabled) { background: #a8802a; }
  .btn:disabled { background: #2a2418; cursor: not-allowed; color: #5a4a30; }
  .btn.small { padding: 4px 8px; font-size: 11px; margin-top: 4px; width: auto; }
  .btn.red { background: #8a2a2a; } .btn.red:hover:not(:disabled) { background: #b03a3a; }
  .btn.green { background: #2a7a3a; } .btn.green:hover:not(:disabled) { background: #3a9a4a; }

  .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 8px; background: #241e14; border-radius: 6px; margin-bottom: 4px;
    font-size: 11px; border-left: 3px solid #4a3a20; gap: 6px; flex-wrap: wrap;

  .item.地 { border-left-color: #dcdcaa; }
  .item.玄 { border-left-color: #4ec9b0; }
  .item.黄 { border-left-color: #888; }

  .item .attr { color: #8a7a60; font-size: 10px; margin-top: 1px; }
  .item button {

  .item button:hover { background: #a8802a; }
  .item button.red { background: #8a2a2a; }
  .empty { color: #5a4a30; text-align: center; padding: 16px; font-size: 12px; }

  .event-card {
    background: #241e14; border: 1px solid #4a3a20; border-radius: 8px;
    padding: 10px; margin-bottom: 8px;
  }
  .event-card .evt-title { color: #d4a857; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
  .event-card .evt-desc { color: #b8a888; font-size: 11px; line-height: 1.5; margin-bottom: 6px; }
  .event-card .evt-options button {
    width: 100%; text-align: left; padding: 5px 8px; margin-bottom: 3px;
    background: #1a1610; color: #d4c8b8; border: 1px solid #3a3020; border-radius: 4px;
    font-size: 11px; cursor: pointer;
  }
  .event-card .evt-options button:hover { background: #2e2618; border-color: #8a6a2a; }

  .building-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .building {
    background: #241e14; border: 1px solid #3a3020; border-radius: 6px;
    padding: 8px; text-align: center; cursor: pointer;

  .building:hover { border-color: #8a6a2a; }
  .building .b-name { color: #d4a857; font-size: 12px; font-weight: bold; }

  .building .b-desc { color: #8a7a60; font-size: 9px; margin-top: 2px; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 998;
    display: flex; justify-content: center; align-items: center;
  }
  .modal {
    background: #1a1610; border: 1px solid #8a6a2a; border-radius: 12px;
    padding: 16px; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto;

  .modal .close-btn {

    border: none; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .modal .close-btn:hover { background: #a8802a; }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #241e14; color: #d4a857; border: 1px solid #8a6a2a;
    border-radius: 8px; padding: 8px 16px; font-size: 12px; z-index: 999;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    animation: toastIn 0.3s ease;
  }
  @keyframes toastIn { from { opacity: 0; top: 0; } to { opacity: 1; top: 20px; } }

  .disciples-collapse {
    background: #241e14; border-radius: 6px; padding: 8px; margin-bottom: 4px;

    border: 1px solid #3a3020; border-radius: 4px; cursor: pointer;
  }
  .filter-bar button.active { background: #8a6a2a; color: #fff; }
</style>

function fmt(n) {
  const num = Number(n);
  if (!isFinite(num)) return "0";
  if (num >= 100000000) return (num / 100000000).toFixed(2) + "亿";
  if (num >= 10000) return (num / 10000).toFixed(2) + "万";
  return Math.floor(num).toLocaleString("en-US");

  div.className = cls;
  div.textContent = msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.children.length > 80) logEl.removeChild(logEl.firstChild);
}

function toast(msg) {
  const div = document.createElement("div");
  div.className = "toast";
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2000);
}

// ==================== 弟子生成 ====================
function rollQuality() {
  const total = QUALITIES.reduce((s, q) => s + q.weight, 0);
  let r = Math.random() * total;
  for (const q of QUALITIES) {
    if (r < q.weight) return q;
    r -= q.weight;
  }
  return QUALITIES[QUALITIES.length - 1];
}

function generateDisciple(forceQuality) {
  const gender = Math.random() < 0.5 ? "male" : "female";
  const surname = pick(SURNAME);
  const given = gender === "male" ? pick(MALE_GIVEN) : pick(FEMALE_GIVEN);
  const q = forceQuality ? QUALITIES.find(x => x.name === forceQuality) : rollQuality();
  const cls = pick(CLASSES);
  return {
    id: Date.now() + Math.random(),
    name: surname + given,
    gender,
    quality: q.name,
    qualityMult: q.mult,
    classKey: cls.key,
    className: cls.name,
    level: 1,
    hp: 100,
    maxHp: 100,
    loyalty: 70,
    status: "修炼中",
    role: "杂役",
    birthTick: Date.now(),
  };
}

function getDiscipleMax(role) {
  const limits = { 杂役: 5 + state.buildings.dorm * 100, 外门: 300, 内门: 100, 核心: 20, 圣子: 6, 长老: 10 };
  return limits[role] || 0;
}

function getDiscipleCount(role) {
  return state.disciples.filter(d => d.role === role && d.hp > 0).length;
}

function addDisciple(d, role = "杂役") {
  const max = getDiscipleMax(role);
  const cur = getDiscipleCount(role);
  if (cur >= max) {
    return false;
  }
  d.role = role;
  state.disciples.push(d);
  return true;
}

// ==================== 属性计算 ====================
function getDisciplePower(d) {
  if (d.hp <= 0) return 0;
  const cls = CLASSES.find(c => c.key === d.classKey);
  const base = 10 + d.level * 5;
  let p = base * d.qualityMult * cls.powerMult;
  // 忠诚 100 加成
  if (d.loyalty >= 100) p *= 1.1;
  return Math.floor(p);
}

function getSectPower() {
  return state.disciples.reduce((s, d) => s + getDisciplePower(d), 0);
}

function getLoyaltyBonus() {
  return state.skills["j13"] ? 20 : 0;
}

// ==================== 职位晋升 ====================
function tryPromote() {
  // 杂役 → 外门
  const candidates1 = state.disciples.filter(d => d.role === "杂役" && d.hp > 0 && d.level >= 20 && d.loyalty >= 60);
  for (const d of candidates1) {
    if (getDiscipleCount("外门") >= getDiscipleMax("外门")) break;
    d.role = "外门";
  }
  // 外门 → 内门
  const candidates2 = state.disciples.filter(d => d.role === "外门" && d.hp > 0 && d.level >= 50 && d.loyalty >= 80);
  for (const d of candidates2) {
    if (getDiscipleCount("内门") >= getDiscipleMax("内门")) break;
    d.role = "内门";
  }
  // 内门 → 核心
  const candidates3 = state.disciples.filter(d => d.role === "内门" && d.hp > 0 && d.level >= 80 && d.loyalty >= 90);
  candidates3.sort((a, b) => getDisciplePower(b) - getDisciplePower(a));
  for (const d of candidates3) {
    if (getDiscipleCount("核心") >= getDiscipleMax("核心")) break;
    d.role = "核心";
  }
  // 核心 → 圣子/圣女
  const candidates4 = state.disciples.filter(d => d.role === "核心" && d.hp > 0 && d.level >= 100);
  candidates4.sort((a, b) => getDisciplePower(b) - getDisciplePower(a));
  for (const d of candidates4) {
    if (getDiscipleCount("圣子") >= getDiscipleMax("圣子")) break;
    d.role = "圣子";
  }
  // 满 100 级 → 长老
  const candidates5 = state.disciples.filter(d => d.role !== "长老" && d.hp > 0 && d.level >= 100);
  for (const d of candidates5) {
    if (getDiscipleCount("长老") >= getDiscipleMax("长老")) break;
    d.role = "长老";
  }
}

// ==================== 任务安排 ====================
const TASKS = {
  "历练": { time: 3*60*1000, gold: [30, 120], exp: [5, 20], risk: 0.10, type: "danger" },
  "采药": { time: 2*60*1000, herb: [10, 30], exp: [2, 8], risk: 0.03, type: "herb" },
  "挖矿": { time: 2*60*1000, ore: [10, 30], exp: [2, 8], risk: 0.03, type: "ore" },
  "守山": { time: 5*60*1000, exp: [1, 5], risk: 0.0, type: "safe" },
  "修炼": { time: 2*60*1000, exp: [5, 15], risk: 0.0, type: "safe" },
};

function autoAssignTasks() {
  state.disciples.forEach(d => {
    if (d.hp <= 0 || d.role === "长老") return;
    if (d.task && d.taskEnd && Date.now() < d.taskEnd) return; // 已在任务中
    if (d.status === "生命垂危") return; // 不派任务
    const cls = CLASSES.find(c => c.key === d.classKey);
    const taskName = cls.task;
    startTask(d, taskName);
  });
}

function startTask(d, taskName) {
  const task = TASKS[taskName];
  d.task = taskName;
  d.taskStart = Date.now();
  d.taskEnd = Date.now() + task.time;
  d.status = taskName + "中";
}

function finishTask(d) {
  const task = TASKS[d.task];
  if (!task) { d.task = null; d.status = "修炼中"; return; }
  // 判定死亡
  if (Math.random() < task.risk) {
    // 触发长老召回
    const elders = state.disciples.filter(x => x.role === "长老" && x.hp > 0);
    if (elders.length > 0 && Math.random() < 0.8) {
      log(`弟子【${d.name}】任务遇险，长老出手相救，已脱险`, "rare");
    } else {
      d.hp = 0;
      d.status = "死亡";
      log(`弟子【${d.name}】（${d.quality}品 ${d.className}）任务中陨落`, "danger");
      return;
    }
  }
  // 收益
  const gold = task.gold ? rand(task.gold[0], task.gold[1]) : 0;
  const herb = task.herb ? rand(task.herb[0], task.herb[1]) : 0;
  const ore = task.ore ? rand(task.ore[0], task.ore[1]) : 0;
  const exp = task.exp ? rand(task.exp[0], task.exp[1]) : 0;
  state.gold += gold;
  state.herb += herb;
  state.ore += ore;
  d.level = Math.min(100, d.level + (exp > 10 ? 1 : 0));
  d.task = null;
  d.status = "修炼中";
}

// ==================== 修炼 ====================
function cultivate() {
  const now = Date.now();
  if (now - state._lastCultivate < 10000) return;
  state._lastCultivate = now;
  const libraryBonus = 1 + state.buildings.library * 0.05;
  const zhenBonus = state.disciples.filter(d => d.classKey === "zhen" && d.hp > 0).length * 0.01;
  const rate = libraryBonus + zhenBonus;
  state.disciples.forEach(d => {
    if (d.hp <= 0 || d.role === "长老") return;
    if (d.task) return;
    if (Math.random() < 0.3 * rate) {
      d.level = Math.min(100, d.level + 1);
    }
  });
}

// ==================== 忠诚 ====================
function checkLoyalty() {
  const now = Date.now();
  if (now - state._lastLoyalty < 30000) return;

      state.disciples = state.disciples.filter(x => x.id !== d.id);
      log(`弟子【${d.name}】叛逃出宗`, "danger");

  });
}

// ==================== 招募 ====================
function recruitN(n) {
  let tian = 0, di = 0, xuan = 0, huang = 0;
  let dCount = 0;
  for (let i = 0; i < n; i++) {
    state.recruitCount++;
    state.pityDi++;
    state.pityTian++;
    let forceQ = null;
    if (state.pityTian >= 100) { forceQ = "天"; state.pityTian = 0; }
    else if (state.pityDi >= 10) { forceQ = "地"; state.pityDi = 0; }
    const d = generateDisciple(forceQ);
    if (d.quality === "天") { tian++; state.pityTian = 0; }
    else if (d.quality === "地") { di++; state.pityDi = 0; }
    else if (d.quality === "玄") xuan++;
    else huang++;
    if (addDisciple(d)) dCount++;
  }
  log(`招募 ${n} 次：天 ${tian} · 地 ${di} · 玄 ${xuan} · 黄 ${huang}`, "gold");
  if (tian > 0) toast(`🎉 抽到天阶弟子 ×${tian}！`);
  return dCount;
}

function healDisciple() {
  const d = state.disciples.find(x => x.hp > 0 && x.hp < x.maxHp * 0.5);
  if (!d) { log("没有受伤的弟子", "danger"); return; }
  d.hp = d.maxHp;
  log(`弟子【${d.name}】伤势痊愈`, "gold");
}

function reviveDisciple() {
  const d = state.disciples.find(x => x.hp <= 0);
  if (!d) { log("没有死亡的弟子", "danger"); return; }
  d.hp = Math.floor(d.maxHp * 0.5);
  d.loyalty = Math.max(0, d.loyalty - 20);
  d.status = "修炼中";
  log(`弟子【${d.name}】还魂复活（忠诚 -20）`, "gold");
}

// ==================== 批量管理 ====================
function batchManage() {
  const choice = prompt(
    "批量管理：\n" +
    "1 = 遣散所有黄阶杂役\n" +
    "2 = 遣散所有玄阶杂役\n" +
    "3 = 遣散所有杂役\n" +
    "输入数字选择："
  );
  if (!choice) return;
  let targets = [];
  let refund = 0;
  if (choice === "1") {
    targets = state.disciples.filter(d => d.role === "杂役" && d.quality === "黄");
    refund = 5;
  } else if (choice === "2") {
    targets = state.disciples.filter(d => d.role === "杂役" && d.quality === "玄");
    refund = 20;
  } else if (choice === "3") {
    targets = state.disciples.filter(d => d.role === "杂役");
    targets.forEach(d => {
      if (d.quality === "黄") refund += 5;
      else if (d.quality === "玄") refund += 20;
      else if (d.quality === "地") refund += 100;
      else if (d.quality === "天") refund += 500;
    });
  } else {
    return;
  }
  if (targets.length === 0) { log("没有符合条件的弟子", "danger"); return; }
  const ids = new Set(targets.map(d => d.id));
  state.disciples = state.disciples.filter(d => !ids.has(d.id));
  if (choice !== "3") refund *= targets.length;
  state.gold += refund;
  log(`遣散 ${targets.length} 名弟子，返还 ${refund} 灵石`, "gold");
  updateUI();
}

function renderDisciples() {
  const list = document.getElementById("discipleList");
  list.innerHTML = "";
  const roles = ["圣子", "核心", "内门", "外门", "杂役", "长老"];
  const order = { "长老": 0, "圣子": 1, "核心": 2, "内门": 3, "外门": 4, "杂役": 5 };
  let filtered = state.disciples.filter(d => d.hp > 0);
  if (currentFilter !== "all") filtered = filtered.filter(d => d.role === currentFilter);

  // 按职位分组
  const groups = {};
  roles.forEach(r => groups[r] = []);
  filtered.forEach(d => { if (groups[d.role]) groups[d.role].push(d); });

  // 排序
  Object.keys(groups).forEach(r => {
    groups[r].sort((a, b) => getDisciplePower(b) - getDisciplePower(a));
  });

  // 渲染
  roles.forEach(role => {
    const arr = groups[role];
    if (arr.length === 0) return;
    const showAll = ["圣子", "核心", "长老"].includes(role) || currentFilter === role;
    const toShow = showAll ? arr : arr.slice(0, 3);

    if (!showAll && arr.length > 3) {
      const div = document.createElement("div");
      div.className = "disciples-collapse";
      div.textContent = `▼ ${role}（${arr.length} 人，点击展开）`;
      div.addEventListener("click", () => {
        currentFilter = role;
        document.querySelectorAll("#discipleFilter button").forEach(b => b.classList.remove("active"));
        updateUI();
      });
      list.appendChild(div);
    }

    toShow.forEach(d => {
      const el = document.createElement("div");
      el.className = "item " + d.quality;
      const genderIcon = d.gender === "male" ? "♂" : "♀";
      const genderCls = d.gender === "male" ? "male" : "female";
      el.innerHTML = `
        <div style="flex:1;min-width:0;">
          <div class="name">${d.name} <span class="${genderCls}">${genderIcon}</span>
            <span class="${d.quality === "天" ? "tian" : d.quality === "地" ? "di" : d.quality === "玄" ? "xuan" : "huang"}">${d.quality}品</span>
            · ${d.className} · ${d.role}</div>
          <div class="attr">Lv.${d.level} · 战力 ${getDisciplePower(d)} · 忠诚 ${d.loyalty}</div>
          <div class="attr">${d.task ? d.task + "中" : d.status}</div>
        </div>
      `;
      list.appendChild(el);
    });
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">没有符合条件的弟子</div>';
  }

  document.getElementById("discipleFilter").querySelectorAll("button").forEach(b => {
    b.classList.toggle("active", b.dataset.filter === currentFilter);
  });
}

      <div class="b-desc">${b.desc}</div>
      <div class="b-lv" style="color:#ffd700;margin-top:4px;">${lv >= b.maxLv ? "已满级" : `${fmt(cost)} 灵石`}</div>
    `;
    if (lv < b.maxLv) {
      div.addEventListener("click", () => {
        if (state.gold < cost) { log("灵石不足", "danger"); return; }
        state.gold -= cost;
        state.buildings[b.key]++;
        log(`【${b.name}】升级到 Lv.${state.buildings[b.key]}`, "gold");
        updateUI();
      });
    }
    grid.appendChild(div);
  });
}

function renderSkills() {
  const list = document.getElementById("skillList");
  list.innerHTML = "";
  document.getElementById("skillCount").textContent = `${Object.keys(state.skills).length} / 16`;
  SKILLS.forEach(s => {
    const learned = !!state.skills[s.key];
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div style="flex:1;">
        <div class="name">${s.name} <span style="color:#888">[${s.tier}阶]</span></div>
        <div class="attr">${s.desc}</div>
      </div>
      <button data-skill="${s.key}" ${learned ? "disabled" : ""}>${learned ? "已学" : `${s.price} 灵石`}</button>
    `;
    list.appendChild(div);
  });
  list.querySelectorAll("[data-skill]").forEach(btn => {
    btn.addEventListener("click", () => {
      const s = SKILLS.find(x => x.key === btn.dataset.skill);
      if (!s) return;
      if (state.gold < s.price) { log("灵石不足", "danger"); return; }
      state.gold -= s.price;
      state.skills[s.key] = true;
      log(`学会功法【${s.name}】`, "gold");
      updateUI();
    });
  });
}

function renderShop() {
  const list = document.getElementById("shopList");
  list.innerHTML = "";
  document.getElementById("recruitCount").textContent = state.recruitCount;
  document.getElementById("pityDi").textContent = 10 - state.pityDi;
  document.getElementById("pityTian").textContent = 100 - state.pityTian;
  SHOP_ITEMS.forEach(s => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div style="flex:1;">
        <div class="name">${s.name}</div>
        <div class="attr">${s.desc}</div>
      </div>
      <button data-shop="${s.key}">${s.price} 灵石</button>
    `;
    list.appendChild(div);
  });
  list.querySelectorAll("[data-shop]").forEach(btn => {
    btn.addEventListener("click", () => {
      const s = SHOP_ITEMS.find(x => x.key === btn.dataset.shop);
      if (!s) return;
      if (state.gold < s.price) { log("灵石不足", "danger"); return; }
      state.gold -= s.price;
      s.action();
      updateUI();
    });
  });
}

// ==================== 存档 ====================
const SAVE_KEY = "zongmen_save_v1";

function saveLocal() {
  try {
    const data = { ...state };
    delete data._lastAutoRecruit;
    delete data._lastEvent;
    delete data._lastCultivate;
    delete data._lastSaveTick;
    delete data._lastGoldTick;
    delete data._lastHerbTick;
    delete data._lastInteraction;
    delete data._lastLoyalty;
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    state.lastSave = Date.now();
  } catch (e) { console.warn("保存失败", e); }
}

function loadLocal() {
  const saved = localStorage.getItem(SAVE_KEY);
  if (!saved) return false;
  try {
    const data = JSON.parse(saved);
    Object.assign(state, data);
    state.lastTick = Date.now();
    state._lastAutoRecruit = 0;
    state._lastEvent = 0;
    state._lastCultivate = 0;
    state._lastGoldTick = 0;
    state._lastHerbTick = 0;
    state._lastLoyalty = 0;
    return true;
  } catch (e) { return false; }
}

// ==================== 离线收益 ====================
function offlineEarnings() {
  const last = state.lastSave || Date.now();
  const now = Date.now();
  const diffSec = Math.floor((now - last) / 1000);
  if (diffSec < 60) return;
  const capSec = Math.min(diffSec, 24 * 3600);
  const hours = Math.floor(capSec / 3600);
  const mins = Math.floor((capSec % 3600) / 60);
  const timeStr = hours > 0 ? `${hours} 小时 ${mins} 分钟` : `${mins} 分钟`;

  // 灵石
  const goldGain = Math.floor(capSec / 5 * (state.buildings.farm * 10 + 10));
  // 药材
  const herbGain = Math.floor(capSec / 10 * state.buildings.garden * 5);
  // 弟子经验
  const discCount = state.disciples.filter(d => d.hp > 0 && d.role !== "长老").length;
  const expGain = Math.floor(capSec / 10 * discCount * 0.3);
  // 弟子死亡（离线）
  const deadCount = { 天: 0, 地: 0, 玄: 0, 黄: 0 };
  const aliveDisc = state.disciples.filter(d => d.hp > 0 && d.role !== "长老");
  aliveDisc.forEach(d => {
    if (Math.random() < 0.005) {
      d.hp = 0;
      deadCount[d.quality]++;
    }
  });

  state.gold += goldGain;
  state.herb += herbGain;

  // 弹窗
  const modal = document.createElement("div");
  modal.className = "modal-bg";
  modal.innerHTML = `
    <div class="modal">
      <h3>📦 离线收益汇总</h3>
      <div class="row"><span>离线时长</span><span>${timeStr}</span></div>
      <div class="row"><span>💎 灵石</span><span>+${fmt(goldGain)}</span></div>
      <div class="row"><span>🌿 药材</span><span>+${fmt(herbGain)}</span></div>
      <div class="row"><span>👤 弟子经验</span><span>+${fmt(expGain)}</span></div>
      ${deadCount.天 > 0 ? `<div class="row" style="color:#ff6b6b;"><span>💀 天阶死亡</span><span>${deadCount.天} 人</span></div>` : ""}
      ${deadCount.地 > 0 ? `<div class="row" style="color:#dcdcaa;"><span>💀 地阶死亡</span><span>${deadCount.地} 人</span></div>` : ""}
      ${deadCount.玄 > 0 ? `<div class="row" style="color:#4ec9b0;"><span>💀 玄阶死亡</span><span>${deadCount.玄} 人</span></div>` : ""}
      ${deadCount.黄 > 0 ? `<div class="row" style="color:#888;"><span>💀 黄阶死亡</span><span>${deadCount.黄} 人</span></div>` : ""}
      <button class="close-btn" id="closeModal">领 取</button>
    </div>
  `;
  document.body.appendChild(modal);
  modal.querySelector("#closeModal").addEventListener("click", () => modal.remove());
}

// ==================== 主循环 ====================
function tick() {
  const now = Date.now();
  const dt = (now - state.lastTick) / 1000;
  state.lastTick = now;

  // 任务结算
  state.disciples.forEach(d => {
    if (d.task && d.taskEnd && now >= d.taskEnd) {
      finishTask(d);
    }
  });

  // 自动派任务
  if (now - (state._lastAssign || 0) > 5000) {
    state._lastAssign = now;
    autoAssignTasks();
  }

  // 修炼
  cultivate();

  // 产出
  produce();

  // 自动招募
  autoRecruit();

  // 忠诚
  checkLoyalty();

  // 事件
  spawnEvent();

  // 自动晋升
  if (now - (state._lastPromote || 0) > 10000) {
    state._lastPromote = now;
    tryPromote();
  }

  // 宗门升级
  const need = SECT_NEED[state.sectLevel];
  if (state.sectExp >= need && state.sectLevel < SECT_LEVELS.length - 1) {
    state.sectExp -= need;
    state.sectLevel++;
    log(`🎉 宗门升级！当前等级：${SECT_LEVELS[state.sectLevel]}`, "gold");
    toast(`🎉 宗门升级！${SECT_LEVELS[state.sectLevel]}`);
  }

  updateUI();

  // 自动存档
  if (now - state.lastSave > 30000) {
    saveLocal();
  }
}

// ==================== 事件绑定 ====================
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
  });
});

document.getElementById("meditateBtn").addEventListener("click", () => {
  state.disciples.forEach(d => { if (d.hp > 0) d.level = Math.min(100, d.level + 1); });
  log("全体弟子闭关修炼，等级 +1", "gold");
  updateUI();
});

document.getElementById("autoRecruitBtn").addEventListener("click", () => {
  state.autoRecruit = !state.autoRecruit;
  updateUI();
});

document.getElementById("batchManageBtn").addEventListener("click", batchManage);

document.getElementById("discipleFilter").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  currentFilter = e.target.dataset.filter;
  renderDisciples();
});

// ==================== 启动 ====================
function init() {
  const loaded = loadLocal();
  if (!loaded) {
    // 新档
    addDisciple(generateDisciple());
    log("你继承了一座破庙，开始了宗门经营之路……", "gold");
    log("提示：弟子会自动修炼、自动接任务，事件会攒着等你处理。", "rare");
  } else {
    log("已从本地读取存档", "gold");
    offlineEarnings();
  }

  updateUI();
  setInterval(tick, 1000);
}

init();
</script>
